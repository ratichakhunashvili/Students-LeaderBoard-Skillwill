<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="dark-bg">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="position-sticky pt-3">
                    <div class="sidebar-header mb-4">
                        <h5 class="text-white">🏆 Leaderboard</h5>
                        <small class="text-muted" id="pageRole">View</small>
                    </div>

                    <ul class="nav flex-column" id="navMenu">
                        <li class="nav-item">
                            <a class="nav-link" href="admin.html">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="leaderboard.html">
                                <i class="bi bi-trophy"></i> Leaderboard
                            </a>
                        </li>
                    </ul>

                    <hr class="bg-secondary">

                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 col-lg-10 px-4 py-4">
                <div class="mb-4">
                    <h2 class="text-white mb-2">🏆 Leaderboard</h2>
                    <p class="text-muted">Top performers ranked by total points</p>
                </div>

                <!-- Leaderboard Table -->
                <div class="card bg-dark border-secondary">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover">
                                <thead>
                                    <tr class="border-bottom border-secondary">
                                        <th style="width: 10%">Rank</th>
                                        <th style="width: 50%">Student Name</th>
                                        <th style="width: 25%">Total Points</th>
                                        <th style="width: 15%">Activities</th>
                                    </tr>
                                </thead>
                                <tbody id="leaderboardBody">
                                    <tr>
                                        <td colspan="4" class="text-center text-muted py-4">Loading leaderboard...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Your Position Card -->
                <div class="row mt-4" id="myPositionCard" style="display: none;">
                    <div class="col-12">
                        <div class="card bg-gradient-purple border-0">
                            <div class="card-body">
                                <h5 class="text-white mb-2">Your Position</h5>
                                <div class="row">
                                    <div class="col-md-4">
                                        <p class="text-white-50 mb-1">Rank</p>
                                        <h3 class="text-white" id="myPositionRank">#1</h3>
                                    </div>
                                    <div class="col-md-4">
                                        <p class="text-white-50 mb-1">Points</p>
                                        <h3 class="text-white" id="myPositionPoints">0</h3>
                                    </div>
                                    <div class="col-md-4">
                                        <p class="text-white-50 mb-1">Behind Leader</p>
                                        <h3 class="text-white" id="myPositionDiff">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
