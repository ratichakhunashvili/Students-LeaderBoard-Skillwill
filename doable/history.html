<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Point History</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link rel="icon" href="data:," />
  </head>
  <body class="dark-bg">
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar">
          <div class="position-sticky pt-3">
            <div class="sidebar-header mb-4">
              <h5 class="text-white">🏆 Leaderboard</h5>
              <small class="text-muted" id="studentNameDisplay">Student</small>
            </div>

            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link" href="students.html">
                  <i class="bi bi-speedometer2"></i> Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="leaderboard.html">
                  <i class="bi bi-trophy"></i> Leaderboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="history.html">
                  <i class="bi bi-clock-history"></i> Point History
                </a>
              </li>
            </ul>

            <hr class="bg-secondary" />

            <div class="d-grid gap-2">
              <button
                class="btn btn-outline-danger btn-sm"
                onclick="logoutStudent()"
              >
                <i class="bi bi-box-arrow-right"></i> Logout
              </button>
            </div>
          </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 px-4 py-4">
          <div class="mb-4">
            <h2 class="text-white mb-2">📊 Point History</h2>
            <p class="text-muted">
              Track all your earned points and activities
            </p>
          </div>

          <!-- Stats -->
          <div class="row mb-4">
            <div class="col-md-3">
              <div class="card bg-gradient-green border-0">
                <div class="card-body">
                  <h6 class="text-white-50">Total Points</h6>
                  <h2 class="text-white mb-0" id="totalPoints">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card bg-gradient-blue border-0">
                <div class="card-body">
                  <h6 class="text-white-50">Activities</h6>
                  <h2 class="text-white mb-0" id="activitiesCount">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card bg-gradient-orange border-0">
                <div class="card-body">
                  <h6 class="text-white-50">This Month</h6>
                  <h2 class="text-white mb-0" id="monthPoints">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card bg-gradient-purple border-0">
                <div class="card-body">
                  <h6 class="text-white-50">Current Rank</h6>
                  <h2 class="text-white mb-0" id="currentRank">#-</h2>
                </div>
              </div>
            </div>
          </div>

          <!-- History Timeline -->
          <div class="card bg-dark border-secondary">
            <div class="card-body">
              <h5 class="card-title text-white mb-4">Recent Activities</h5>
              <div id="historyTimeline">
                <p class="text-muted text-center py-4">No activities yet</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
